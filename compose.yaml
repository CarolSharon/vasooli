services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vasooli
      POSTGRES_USER: vasooli
      POSTGRES_PASSWORD: vasooli
    ports:
      - "5432:5432"
    volumes:
      - vasooli_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vasooli -d vasooli"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vasooli_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vasooli_postgres:
  vasooli_redis:
